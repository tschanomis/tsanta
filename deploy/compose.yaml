name: santa
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${SANTA_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${AUTH_URL:?}
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['connexion', 'api/auth/providers'].map(path => fetch('http://127.0.0.1:3000/' + path))).then(responses => { if (responses.some(r => !r.ok)) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
